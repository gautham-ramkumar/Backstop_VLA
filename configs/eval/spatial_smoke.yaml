seed: 0
output_dir: artifacts/eval/spatial_smoke
policy:
  type: smolvla
  path: HuggingFaceVLA/smolvla_libero
  revision: 6721902bc4d61e50a3bfdb11dfb4cb626f05d102
  device: cuda
  n_action_steps: 1
  num_steps: 10
env:
  type: libero
  task: libero_spatial
  task_ids: [0]
  control_mode: relative
  init_states: true
  mujoco_gl: osmesa
eval:
  n_episodes: 2
  batch_size: 1
  max_parallel_tasks: 1
record:
  enabled: true
  k_samples: 4
  repo_id: local/backstop_spatial_smoke
  root: data/lerobot/backstop_spatial_smoke
wandb:
  project: backstop
  enabled: true
  mode: offline
# Smoke gate is "did the loop run end to end", not "did it score".
# 2 episodes cannot resolve a 70-90% band; the baseline config owns tolerance.
tolerance:
  min_success_rate: 0.0
  max_success_rate: 1.0
  fallback_num_steps: 1
  enforce: false
