[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backstop"
version = "0.1.0"
description = "Runtime failure prediction for vision-language-action robot policies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Gautham Ramkumar" }]
# numpy and pyarrow are core: the guard, labels and recovery read recorded
# corpora with them, and CI's CPU job must be able to import and test that code.
dependencies = [
    "numpy>=2.2,<3",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
    # Exact: env/libero.py, perturb/ and policy/adapter.py reach into lerobot
    # internals (`unwrapped._env`, `_format_raw_obs`, `_get_action_chunk`).
    "lerobot[libero,smolvla]==0.6.1",
    "mujoco==3.3.2",
    "wandb>=0.19",
]
dev = [
    "ruff>=0.11",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pre-commit>=4.2",
]

[project.scripts]
backstop-eval = "backstop.eval.cli:main"
backstop-record = "backstop.record.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backstop"]

[tool.hatch.build.targets.sdist]
include = ["src/backstop", "configs", "docs", "README.md"]

[tool.uv]
default-groups = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests", "scripts"]
# Resolve the same import roots pytest uses, so tests importing scripts or
# tests/fakes are type-checked against the real code.
extraPaths = ["src", "scripts", "tests"]
exclude = [".venv", "data", "artifacts", "wandb"]
venvPath = "."
venv = ".venv"
reportMissingImports = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is importable so experiment drivers can be tested directly, and
# tests/ so shared test doubles (tests/fakes) are one import away.
pythonpath = ["src", "scripts", "tests"]
addopts = "-q -p no:launch_testing"
filterwarnings = ["ignore::DeprecationWarning"]
