<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backstop -- failure review</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --border: #2c3038;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #5b8cff;
    --success: #3fbf7f;
    --failure: #e2564f;
    --pending: #d4a83f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header select { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; }
  #shard-stats { color: var(--muted); font-size: 13px; }
  #layout { display: flex; height: calc(100vh - 45px); }
  #sidebar { width: 280px; border-right: 1px solid var(--border); overflow-y: auto; }
  .ep-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid #22252b;
    font-size: 13px;
  }
  .ep-row:hover { background: #22252b; }
  .ep-row.selected { background: #262b36; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
  }
  .badge.success { background: rgba(63,191,127,0.18); color: var(--success); }
  .badge.failure { background: rgba(226,86,79,0.18); color: var(--failure); }
  .badge.reviewed { background: rgba(91,140,255,0.18); color: var(--accent); }
  .badge.pending { background: rgba(212,168,63,0.18); color: var(--pending); }
  .ep-idx { color: var(--muted); width: 34px; }
  .ep-cat { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #main { flex: 1; padding: 16px; overflow-y: auto; }
  #video-wrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  video { background: black; width: 100%; max-width: 420px; border-radius: 6px; }
  #panels { flex: 1 1 280px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; min-width: 0; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  #task-line { font-size: 15px; margin: 12px 0 6px; }
  form#review-form { display: flex; flex-direction: column; gap: 10px; }
  form label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  input[type=text], textarea, input[type=number] {
    width: 100%;
    background: #14161a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 13px;
  }
  textarea { min-height: 50px; resize: vertical; }
  .onset-row { display: flex; gap: 8px; align-items: center; }
  .onset-row input[type=number] { width: 80px; }
  .onset-row input[type=range] { flex: 1; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary { background: #33373f; }
  button.tiny { padding: 3px 8px; font-size: 11px; }
  .row { display: flex; gap: 8px; }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
  #save-status { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Backstop -- failure review</h1>
  <select id="shard-select"></select>
  <span id="shard-stats"></span>
</header>
<div id="layout">
  <div id="sidebar"></div>
  <div id="main"><div id="empty">Pick a shard, then an episode.</div></div>
</div>
<script src="/static/review.js"></script>
</body>
</html>
